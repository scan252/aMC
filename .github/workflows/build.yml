name: Build Windows

on:
  push:
    branches: [feat/win, main]
    tags: ['v*']
  pull_request:
    branches: [main, feat/win]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Build
        run: wails3 task build

      - name: Run Go tests
        run: go test ./internal/...

      - name: Compute checksum
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin/amc-suite.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "exe size: $((Get-Item bin/amc-suite.exe).Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amc-suite-windows
          path: windows/bin/amc-suite.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/bin/amc-suite.exe
          body: |
            aMC Suite Windows 构建

            - 安装要求：Windows 10/11（WebView2 运行时系统自带）
            - SHA256: ${{ steps.checksum.outputs.sha256 }}
