[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amc"
version = "0.1.0"
description = "鸣潮 Mac 版抽卡记录助手 — 从游戏日志抓取唤取历史"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "aMC" }]
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
amc = "amc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["amc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
